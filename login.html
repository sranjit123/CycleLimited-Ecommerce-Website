<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
   
    <section class="login-container">
        <div class="image-section">
            <a href="index.html"><img src="images/cycleslimfinal.svg" alt="Company Logo"></a>
        </div>
        <div class="login-form">
          
                <h2>Welcome</h2>
                <p>Get started for a seamless shopping experience</p>
                <form action="" id="loginForm">
                    <div class="validation">
                        <div class="email-container validation-show">
                            <label for="email">Email</label>
                            <input type="text" id="email" placeholder="Email">
                             <div id="emailMessage" class="errorColor validation-hide"></div>
                        </div>
                        <div class="password-container validation-show">
                            <label for="password">Password</label>
                            <input type="password" name="password" id="password" placeholder="Password">
                            <button type="button" id="eye-btn"><i class="fa-solid fa-eye"></i></button>
                            <div id="passwordMessage" class="errorColor validation-hide"></div>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Log In</button>
                    <p>Don't have an account? <a href="register.html">Register</a></p>            
                </form>
        </div>
    </section>
    <script src="js/login.js"></script>
</body>
</html>
